<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LAST SWING - GG Rank</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: calc(100vw * 540 / 960);
    }
    @media (max-width: 960px) {
      #game-container {
        width: 100vw;
        height: calc(100vw * 540 / 960);
      }
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #score-overlay {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 10;
    }
    #gameover-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .go-box {
      background: #16213e;
      border: 2px solid #ee2b8c;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      width: 380px;
      max-width: 95%;
      max-height: 95%;
      overflow-y: auto;
    }
    .go-box h2 {
      color: #ee2b8c;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .go-score {
      font-size: 18px;
      margin-bottom: 12px;
    }
    .go-score strong { color: #fbbf24; font-size: 24px; }
    .go-form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .go-form input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #0f3460;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .go-form input:focus { border-color: #ee2b8c; }
    .go-form button {
      padding: 8px 14px;
      background: #ee2b8c;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .go-form button:hover { background: #cc2477; }
    .go-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    #submit-status { min-height: 20px; font-size: 13px; margin-bottom: 8px; }
    #leaderboard-section h3 {
      font-size: 14px;
      color: #ee2b8c;
      margin-bottom: 6px;
    }
    #leaderboard-section table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    #leaderboard-section th {
      color: #aaa;
      border-bottom: 1px solid #333;
      padding: 4px 6px;
      text-align: left;
    }
    #leaderboard-section td {
      padding: 3px 6px;
      border-bottom: 1px solid #222;
    }
    #leaderboard-section tr.highlight td {
      color: #fbbf24;
      font-weight: 600;
    }
    .go-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }
    .restart-btn {
      padding: 10px 32px;
      background: #ee2b8c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .restart-btn:hover { background: #cc2477; }
    .switch-map-btn {
      padding: 10px 20px;
      background: #0f3460;
      color: #fff;
      border: 1px solid #ee2b8c;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .switch-map-btn:hover { background: #1a4a7a; }
    #branding {
      margin-top: 4px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    #branding a {
      color: #ee2b8c;
      text-decoration: none;
      font-weight: 600;
    }
    #branding a:hover { text-decoration: underline; }
    /* --- Title Page --- */
    #title-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .title-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .title-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.28), rgba(2,6,23,0.20), rgba(0,0,0,0.62));
    }
    .title-bottom {
      position: absolute;
      bottom: 14%;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    .title-map-label {
      margin-bottom: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.35);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: #f1f5f9;
    }
    #title-asset-status {
      min-height: 22px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f1f5f9;
    }
    .title-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-btn-map {
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #0f172a;
      border: 1px solid rgba(224,242,254,0.8);
      background: linear-gradient(to bottom, #bae6fd, #38bdf8);
      box-shadow: 0 10px 24px rgba(14,165,233,0.35);
      cursor: pointer;
      transition: all 0.15s;
    }
    .title-btn-map:hover { background: linear-gradient(to bottom, #e0f2fe, #7dd3fc); }
    .title-btn-start {
      padding: 10px 36px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #0f172a;
      border: 1px solid rgba(254,243,199,0.8);
      background: linear-gradient(to bottom, #fde68a, #fb923c);
      box-shadow: 0 10px 24px rgba(249,115,22,0.38);
      cursor: pointer;
      transition: all 0.15s;
    }
    .title-btn-start:hover { background: linear-gradient(to bottom, #fef3c7, #fdba74); }
    .title-btn-start:disabled { background: linear-gradient(to bottom, #94a3b8, #64748b); cursor: wait; opacity: 0.8; }

    /* --- Map Picker --- */
    #map-picker-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2,6,23,0.56);
      backdrop-filter: blur(3px);
      z-index: 40;
    }
    .picker-panel {
      width: 600px;
      max-width: 95%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(2,6,23,0.80);
      padding: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .picker-title {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 12px;
    }
    .picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .picker-card {
      position: relative;
      height: 130px;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.15s;
      background: none;
      padding: 0;
      color: #fff;
      text-align: left;
    }
    .picker-card:hover { border-color: rgba(125,211,252,0.6); }
    .picker-card.selected { border-color: #bae6fd; box-shadow: 0 0 0 2px rgba(125,211,252,0.35); }
    .picker-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -o-object-fit: cover;
         object-fit: cover;
      opacity: 0.95;
    }
    .picker-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2,6,23,0.76), rgba(15,23,42,0.3), rgba(15,23,42,0.1));
    }
    .picker-card-info {
      position: relative;
      z-index: 10;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .picker-card-name { font-size: 16px; font-weight: 900; letter-spacing: -0.02em; }
    .picker-card-sub { font-size: 12px; color: rgba(226,232,240,0.9); }
    .picker-badge {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 20;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(103,232,249,0.2);
      border: 1px solid rgba(165,243,252,0.7);
      color: #cffafe;
    }
    .picker-badge.current-badge {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.55);
      color: #fff;
    }
    .picker-actions {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .picker-btn-cancel {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .picker-btn-cancel:hover { background: rgba(255,255,255,0.2); }
    .picker-btn-confirm {
      padding: 8px 24px;
      border-radius: 8px;
      border: 1px solid rgba(165,243,252,0.7);
      background: linear-gradient(to bottom, #22d3ee, #0891b2);
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .picker-btn-confirm:hover { background: linear-gradient(to bottom, #67e8f9, #06b6d4); }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #ee2b8c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 14px;
      color: #888;
      letter-spacing: 1px;
    }

    /* --- Mobile responsive --- */
    @media (max-width: 600px) {
      #score-overlay { font-size: 18px; top: 6px; right: 8px; }
      .go-box { padding: 12px 14px; width: 95%; border-radius: 8px; }
      .go-box h2 { font-size: 18px; margin-bottom: 4px; }
      .go-score { font-size: 14px; margin-bottom: 8px; }
      .go-score strong { font-size: 18px; }
      .go-form { gap: 4px; }
      .go-form input { padding: 6px 8px; font-size: 12px; }
      .go-form button { padding: 6px 10px; font-size: 11px; }
      #submit-status { font-size: 11px; min-height: 16px; margin-bottom: 4px; }
      #leaderboard-section h3 { font-size: 12px; }
      #leaderboard-section table { font-size: 11px; }
      .go-buttons { gap: 6px; margin-top: 8px; }
      .restart-btn { padding: 8px 20px; font-size: 13px; }
      .switch-map-btn { padding: 8px 14px; font-size: 12px; }
      .title-map-label { font-size: 9px; padding: 3px 8px; }
      .title-btn-map { padding: 7px 14px; font-size: 11px; }
      .title-btn-start { padding: 7px 22px; font-size: 11px; }
      #title-asset-status { font-size: 9px; }
      .picker-panel { padding: 10px; }
      .picker-title { font-size: 15px; margin-bottom: 8px; }
      .picker-card { height: 80px; }
      .picker-card-name { font-size: 13px; }
      .picker-card-sub { font-size: 10px; }
      .picker-badge { font-size: 8px; padding: 1px 5px; }
      .picker-btn-cancel, .picker-btn-confirm { padding: 6px 14px; font-size: 10px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-s2yOcOky.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">LOADING...</div>
    </div>
  </div>
  <div id="branding">
    Play more games at <a href="https://ggrank.xyz" target="_blank" rel="noopener">GG Rank</a>
  </div>
</body>
</html>
