<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2048</title>
    <style>
        body { background: #faf8ef; color: #776e65; font-family: "Clear Sans", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .score-box { background: #bbada0; padding: 10px 20px; border-radius: 6px; color: white; text-align: center; margin-bottom: 10px; min-width: 80px; }
        /* This container is now the anchor for all tiles */
        .game-container { position: relative; width: 320px; height: 320px; background: #bbada0; border-radius: 6px; padding: 10px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 10px; width: 100%; height: 100%; }
        .grid-cell { background: rgba(238, 228, 218, 0.35); border-radius: 4px; }
        .tile {
            position: absolute; width: 67.5px; height: 67.5px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; z-index: 10;
            transition: transform 100ms ease-in-out; /* The Smooth Slide */
        }
        .t2 { background: #eee4da; color: #776e65; }
        .t4 { background: #ede0c8; color: #776e65; }
        .t8 { background: #f2b179; color: white; }
        .t16 { background: #f59563; color: white; }
        .t32 { background: #f67c5f; color: white; }
        .t64 { background: #f65e3b; color: white; }
        .t128 { background: #edcf72; color: white; font-size: 24px; }
        #game-over {
            position: absolute; inset: 0; background: rgba(238, 228, 218, 0.7);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="score-box">Score: <b id="score">0</b></div>
    <div class="game-container" id="game-box">
        <div id="game-over">
            <h2>Game Over!</h2>
            <button onclick="init()">Restart</button>
        </div>
        <div class="grid">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
    </div>

    <script>
        let board = Array(16).fill(null), score = 0;
        const box = document.getElementById('game-box');

        function init() {
            document.querySelectorAll('.tile').forEach(t => t.remove());
            board = Array(16).fill(null); score = 0;
            document.getElementById('score').innerText = 0;
            document.getElementById('game-over').style.display = 'none';
            addTile(); addTile();
        }

        function addTile() {
            let empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (!empty.length) return;
            let idx = empty[Math.floor(Math.random() * empty.length)];
            let val = Math.random() > 0.1 ? 2 : 4;
            let el = document.createElement('div');
            el.className = `tile t${val}`;
            el.innerText = val;
            box.appendChild(el);
            board[idx] = { val, el };
            updatePos(el, idx);
        }

        function updatePos(el, idx) {
            const x = (idx % 4) * 77.5 + 10; // Cell size + gap
            const y = Math.floor(idx / 4) * 77.5 + 10;
            el.style.transform = `translate(${x}px, ${y}px)`;
        }

        function move(dir) {
            let moved = false;
            for (let i = 0; i < 4; i++) {
                let indices = [];
                for (let j = 0; j < 4; j++) {
                    if (dir === 'ArrowLeft') indices.push(i * 4 + j);
                    if (dir === 'ArrowRight') indices.push(i * 4 + (3 - j));
                    if (dir === 'ArrowUp') indices.push(j * 4 + i);
                    if (dir === 'ArrowDown') indices.push((3 - j) * 4 + i);
                }
                let line = indices.map(idx => board[idx]).filter(x => x);
                let newLine = [];
                for (let j = 0; j < line.length; j++) {
                    if (line[j+1] && line[j].val === line[j+1].val) {
                        let v = line[j].val * 2; score += v;
                        updatePos(line[j].el, indices[newLine.length]);
                        updatePos(line[j+1].el, indices[newLine.length]);
                        let stay = line[j].el, leave = line[j+1].el;
                        setTimeout(() => { 
                            leave.remove(); stay.innerText = v; stay.className = `tile t${v}`;
                        }, 100);
                        newLine.push({val: v, el: stay});
                        j++; moved = true;
                    } else {
                        updatePos(line[j].el, indices[newLine.length]);
                        if (board[indices[newLine.length]] !== line[j]) moved = true;
                        newLine.push(line[j]);
                    }
                }
                indices.forEach((idx, k) => board[idx] = newLine[k] || null);
            }
            if (moved) {
                document.getElementById('score').innerText = score;
                setTimeout(addTile, 110);
            }
        }

        window.onkeydown = e => { if(e.key.includes('Arrow')) { e.preventDefault(); move(e.key); } };
        init();
    </script>
</body>
</html>
