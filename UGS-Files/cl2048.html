<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 - Ultimate Stash Version</title>
    <style>
        body { background: #faf8ef; color: #776e65; font-family: "Clear Sans", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .heading { width: 300px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 40px; margin: 0; }
        .score-box { background: #bbada0; padding: 5px 15px; border-radius: 3px; color: white; text-align: center; }
        .game-container { background: #bbada0; width: 320px; height: 320px; padding: 10px; border-radius: 6px; position: relative; box-sizing: border-box; touch-action: none; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 10px; width: 100%; height: 100%; }
        .cell { background: rgba(238, 228, 218, 0.35); border-radius: 3px; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; transition: all 0.1s ease-in-out; }
        
        /* Tile Colors */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 20px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 20px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 20px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 16px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 16px; }
    </style>
</head>
<body>
    <div class="heading">
        <h1>2048</h1>
        <div class="score-box">
            <div style="font-size: 10px; text-transform: uppercase;">Score</div>
            <div id="score">0</div>
        </div>
    </div>
    <div class="game-container">
        <div class="grid" id="grid"></div>
    </div>
    <p>Use <b>Arrow Keys</b> to merge tiles!</p>

    <script>
        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        let board = [];
        let score = 0;

        function init() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            gridDisplay.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gridDisplay.appendChild(cell);
            }
            addTile(); addTile(); render();
        }

        function addTile() {
            let empty = [];
            board.forEach((row, r) => row.forEach((val, c) => { if (val === 0) empty.push({r, c}); }));
            if (empty.length) {
                let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() > 0.1 ? 2 : 4;
            }
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            board.flat().forEach((val, i) => {
                cells[i].textContent = val || '';
                cells[i].className = 'cell' + (val ? ` tile-${val}` : '');
            });
            scoreDisplay.textContent = score;
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(direction) {
            let oldBoard = JSON.stringify(board);
            for (let i = 0; i < 4; i++) {
                let row = [];
                if (direction === 'L' || direction === 'R') {
                    row = board[i];
                    if (direction === 'R') row.reverse();
                    let newRow = slide(row);
                    if (direction === 'R') newRow.reverse();
                    board[i] = newRow;
                } else {
                    for (let j = 0; j < 4; j++) row.push(board[j][i]);
                    if (direction === 'D') row.reverse();
                    let newRow = slide(row);
                    if (direction === 'D') newRow.reverse();
                    for (let j = 0; j < 4; j++) board[j][i] = newRow[j];
                }
            }
            if (oldBoard !== JSON.stringify(board)) {
                addTile();
                render();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') move('L');
            if (e.key === 'ArrowRight') move('R');
            if (e.key === 'ArrowUp') move('U');
            if (e.key === 'ArrowDown') move('D');
        });

        init();
    </script>
</body>
</html>
