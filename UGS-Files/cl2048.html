<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2048 Game</title>
    <style>
        /* CSS: Styles the board and the tile colors */
        body { background: #faf8ef; font-family: "Clear Sans", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .game-container { width: 400px; height: 400px; background: #bbada0; border-radius: 6px; position: relative; padding: 15px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 15px; width: 100%; height: 100%; }
        .cell { background: rgba(238, 228, 218, 0.35); border-radius: 3px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 35px; font-weight: bold; color: #776e65; }
        
        /* Tile Colors based on number */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 30px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 30px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 25px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 25px; }
    </style>
</head>
<body>
    <h1>2048</h1>
    <p>Score: <span id="score">0</span></p>
    <div class="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <script>
        /* JS: Handles movement and game logic */
        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        let board = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;

        function init() {
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gridDisplay.appendChild(cell);
            }
            addTile(); addTile(); render();
        }

        function addTile() {
            let empty = [];
            board.forEach((row, r) => row.forEach((val, c) => { if (val === 0) empty.push({r, c}); }));
            if (empty.length) {
                let {r, c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() > 0.1 ? 2 : 4;
            }
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            board.flat().forEach((val, i) => {
                cells[i].textContent = val || '';
                cells[i].className = 'cell' + (val ? ` tile-${val}` : '');
            });
            scoreDisplay.textContent = score;
        }

        // Add simplified slide logic for Arrow Keys here
        document.addEventListener('keydown', (e) => {
            // Simplified logic: filter zeros, merge pairs, add random tile
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                // (Logic would go here to shift board based on key)
                addTile();
                render();
            }
        });

        init();
    </script>
</body>
</html>
