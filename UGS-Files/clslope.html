<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Slope</title>
    <!-- Correct jsDelivr path format: /gh/user/repo@branch/file -->
    <script src="https://cdn.jsdelivr.net/gh/cgolden15/Slope-Game@main/TemplateData/unityloader41.js
"></script>
    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer", 
            "https://cdn.jsdelivr.net/gh/cgolden15/Slope-Game@main/Build/slope.json", 
            {onProgress: (gameInstance, progress) => {
                console.log("Loading Slope: " + (progress * 100) + "%");
            }}
        );
    </script>
</head>
<body style="margin: 0; overflow: hidden; background: #000;">
    <div id="gameContainer" style="width: 100vw; height: 100vh"></div>
</body>
</html>
